<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENT 211 — Entrepreneurship (Types A, B, C)</title>
<style>
  :root{
    --paper: #F6F3EC;
    --paper-raised: #FFFFFF;
    --ink: #23281F;
    --ink-soft: #5B6156;
    --rule: #D9D3C4;
    --ledger: #2E5C46;
    --ledger-dim: #E4ECE6;
    --stamp: #B5482F;
    --stamp-dim: #F6E4DE;
    --gold: #A9852F;
    serif-headline: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 48px 20px 80px;
  }

  .sheet{
    width:100%;
    max-width: 640px;
  }

  /* ---------- masthead ---------- */
  .masthead{
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 28px;
  }

  .masthead h1{
    font-size: 30px;
    letter-spacing: 0.02em;
    color: var(--ledger);
    font-weight: 600;
  }

  .masthead h2{
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-weight: 600;
    font-size: 20px;
    line-height: 1.15;
    margin: 6px 0 8px;
    color: var(--ink);
  }
  /* ---------- progress ledger ---------- */
  .ledger-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 22px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  .ledger-row .count{
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    font-weight: 600;
  }

  .track{
    height: 3px;
    background: var(--rule);
    margin-bottom: 34px;
    position: relative;
    overflow: hidden;
  }
  .track > div{
    position:absolute;
    top:0; left:0; bottom:0;
    background: var(--ledger);
    transition: width .35s ease;
  }

  /* ---------- question card ---------- */
  .card{
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    padding: 32px 30px;
  }

  .qnum{
    font-size: 12.5px;
    color: var(--ledger);
    font-weight: 700;
    letter-spacing: 0.03em;
    margin-bottom: 10px;
  }

  .prompt{
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-size: 21px;
    line-height: 1.4;
    margin: 0 0 26px;
    color: var(--ink);
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom: 6px;
  }

  .option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    text-align:left;
    width:100%;
    background: transparent;
    border: 1px solid var(--rule);
    padding: 13px 16px;
    font-size: 15.5px;
    line-height:1.45;
    color: var(--ink);
    cursor:pointer;
    font-family: inherit;
    transition: border-color .15s ease, background .15s ease;
  }

  .option:hover:not(:disabled){
    border-color: var(--ledger);
    background: var(--ledger-dim);
  }

  .option .tag{
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    border: 1px solid var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-top: 1px;
  }

  .option:disabled{ cursor: default; }

  .option.correct{
    border-color: var(--ledger);
    background: var(--ledger-dim);
  }
  .option.correct .tag{
    background: var(--ledger);
    border-color: var(--ledger);
    color: #fff;
  }

  .option.wrong{
    border-color: var(--stamp);
    background: var(--stamp-dim);
  }
  .option.wrong .tag{
    background: var(--stamp);
    border-color: var(--stamp);
    color: #fff;
  }

  .option.faded{
    opacity: 0.55;
  }

  /* ---------- feedback ---------- */
  .feedback{
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px dashed var(--rule);
    display:none;
  }
  .feedback.show{ display:block; }

  .verdict{
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.01em;
    margin-bottom: 6px;
  }
  .verdict.right{ color: var(--ledger); }
  .verdict.wrong{ color: var(--stamp); }

  .explain{
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0;
  }

  .nextbar{
    margin-top: 22px;
    display:flex;
    justify-content:flex-end;
  }

  button.next{
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    color: #fff;
    background: var(--ink);
    border: none;
    padding: 11px 22px;
    cursor:pointer;
  }
  button.next:hover{ background: var(--ledger); }

  /* ---------- results ---------- */
  .results{
    text-align:left;
  }
  .results .score-line{
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-size: 46px;
    margin: 4px 0 4px;
    color: var(--ink);
  }
  .results .score-of{
    font-size: 17px;
    color: var(--ink-soft);
  }
  .results .remark{
    margin: 18px 0 26px;
    font-size: 15px;
    color: var(--ink-soft);
    line-height:1.55;
  }

  .missed-list{
    margin: 0 0 28px;
    padding: 0;
    list-style:none;
  }
  .missed-list li{
    border-top: 1px solid var(--rule);
    padding: 14px 0;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .missed-list li:last-child{ border-bottom: 1px solid var(--rule); }
  .missed-list .q{ color: var(--ink); font-weight:600; margin-bottom:4px; }
  .missed-list .a{ color: var(--ledger); }
  .missed-list .a b{ font-weight:700; }

  .actions{
    display:flex;
    gap: 12px;
  }
  button.secondary{
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink);
    padding: 11px 22px;
    cursor:pointer;
  }
  button.secondary:hover{ background: var(--ink); color:#fff; }

  @media (max-width: 480px){
    .card{ padding: 24px 20px; }
    .prompt{ font-size: 19px; }
    .masthead h1{ font-size: 25px; }
  }

  @media (prefers-reduced-motion: reduce){
    .track > div{ transition: none; }
  }
</style>
</head>
<body>

<div class="sheet">

  <div class="masthead">
    <h1>ENT 211: Entrepreneurship</h1>
    <h2>All Questions Arranged by Type (A, B, C)</h2>
  </div>

  <div id="quizArea">
    <div class="ledger-row">
      <span>Question <span class="count" id="qposition">1</span> of <span id="qtotal">30</span></span>
      <span id="scoreLive">Score: 0</span>
    </div>
    <div class="track"><div id="trackFill" style="width:0%"></div></div>

    <div class="card" id="card">
      <div class="qnum" id="qnum">Q1</div>
      <p class="prompt" id="prompt"></p>
      <div class="options" id="options"></div>

      <div class="feedback" id="feedback">
        <div class="verdict" id="verdict"></div>
        <p class="explain" id="explain"></p>
      </div>

      <div class="nextbar">
        <button class="next" id="nextBtn" style="display:none;">Next question</button>
      </div>
    </div>
  </div>

  <div id="resultsArea" style="display:none;">
    <div class="card results">
      <div class="qnum">RESULT</div>
      <div class="score-line" id="finalScore">0 / 30</div>
      <div class="score-of" id="finalPercent">0%</div>
      <p class="remark" id="remark"></p>

      <ul class="missed-list" id="missedList"></ul>

      <div class="actions">
        <button class="next" id="retryAll">Retake full quiz</button>
        <button class="secondary" id="retryMissed">Retry missed only</button>
      </div>
    </div>
  </div>

</div>

<script>
const QUESTIONS = [
  // Type A
  {q:"A student intends to establish a food business. Before investing, she studies customer preferences, examines competitors and assesses possible risks. Which entrepreneurial abilities are most evident?",
   options:["Passive thinking and risk avoidance","Networking and business registration","Creative destruction and copyright protection","Critical thinking and calculated decision-making"],
   correct:3,
   explain:"The student is using critical thinking to analyze the market and making calculated decisions based on that analysis.",
   type:"Type A"},
  {q:"When faced with an existing problem, which question best reflects entrepreneurial thinking?",
   options:["How can I avoid changing the present situation?","What useful solution could be developed from this situation?","Who is responsible for this problem?","Why should I become involved?"],
   correct:1,
   explain:"Entrepreneurial thinking focuses on creating solutions and opportunities from problems, not assigning blame or avoiding change.",
   type:"Type A"},
  {q:"An entrepreneur reviews the outcome of a failed business strategy and uses the experience to improve a future strategy. Which thinking process is involved?",
   options:["Reflective thinking","Operational thinking","Competitive thinking","Creative thinking"],
   correct:0,
   explain:"Reflective thinking involves learning from past experiences to improve future actions.",
   type:"Type A"},
  {q:"Which situation provides the strongest evidence that an idea has developed from creativity into innovation?",
   options:["An entrepreneur writes down several possible ideas","An entrepreneur imagines a new product","An entrepreneur develops and applies an idea to create useful value","An entrepreneur discusses a new idea with friends"],
   correct:2,
   explain:"Innovation occurs when an idea is implemented and creates value, not just when it is generated or discussed.",
   type:"Type A"},
  {q:"A business develops a new method of promoting an existing product to a different group of customers. This is an example of:",
   options:["Organizational innovation","Process innovation","Product innovation","Marketing innovation"],
   correct:3,
   explain:"Marketing innovation involves new marketing methods, including targeting new customer segments or changing promotion strategies.",
   type:"Type A"},
  {q:"According to Hébert and Link, which French verb means 'to undertake' and is associated with the origin of the term entrepreneurship?",
   options:["Entreprendre","Entreprendremer","Entrepreneur","Enterprise"],
   correct:0,
   explain:"The term 'entrepreneur' is derived from the French verb 'entreprendre,' which means 'to undertake.'",
   type:"Type A"},
  {q:"An entrepreneur who actively searches for problems, market gaps and better ways of doing things demonstrates the characteristic of an:",
   options:["Opportunity seeker","Risk avoider","Business manager","Passive thinker"],
   correct:0,
   explain:"An opportunity seeker actively looks for problems to solve and gaps to fill, which is a core entrepreneurial trait.",
   type:"Type A"},
  {q:"The process through which an enterprise becomes formally recognized under the applicable legal framework is known as:",
   options:["Business innovation","Business registration","Business planning","Business ownership"],
   correct:1,
   explain:"Business registration is the formal process of registering a business with the appropriate government authority.",
   type:"Type A"},
  {q:"Legal rights that protect creations of the mind, including inventions, logos and original creative works, are collectively known as:",
   options:["Business registration","Creative destruction","Intellectual property","Entrepreneurial resources"],
   correct:2,
   explain:"Intellectual property is the legal term for creations of the mind, which can be protected by patents, trademarks, copyrights, etc.",
   type:"Type A"},
  {q:"In e-commerce, when one individual sells a used item directly to another individual through an online marketplace, the transaction is known as:",
   options:["B2B","C2B","B2C","C2C"],
   correct:3,
   explain:"C2C (Consumer-to-Consumer) transactions occur between two individuals, such as selling a used item on a marketplace.",
   type:"Type A"},
  // Type B
  {q:"What is the best distinction between creativity and innovation?",
   options:["Creativity eliminates risk, whereas innovation creates risk","Creativity is only concerned with artistic activities","Creativity generates ideas, while innovation puts useful ideas into action","Creativity involves business ownership, while innovation involves registration"],
   correct:2,
   explain:"Creativity is about generating new ideas, while innovation is the process of implementing those ideas to create value.",
   type:"Type B"},
  {q:"A farmer replaces traditional irrigation with drip irrigation to conserve water and improve production. This is an example of:",
   options:["Organizational innovation","Process innovation","Product innovation","Marketing innovation"],
   correct:1,
   explain:"Process innovation refers to new or improved methods of production or delivery, such as a new irrigation technique.",
   type:"Type B"},
  {q:"Which of the following is a major purpose of preparing a business plan?",
   options:["To guarantee that the business will succeed","To eliminate every possible business risk","To replace proper financial management","To explain what the business intends to achieve and how it will achieve it"],
   correct:3,
   explain:"A business plan outlines the business's goals, strategies, and the roadmap to achieve them.",
   type:"Type B"},
  {q:"A student creates a unique logo and brand name for a clothing business and wants legal protection for the brand identity. Which intellectual property protection is most relevant?",
   options:["Copyright","Industrial design","Trademark","Patent"],
   correct:2,
   explain:"A trademark protects brand names, logos, and slogans used to identify and distinguish goods or services.",
   type:"Type B"},
  {q:"A wholesaler sells products online directly to a retail business. This transaction is classified as:",
   options:["C2C","B2B","B2C","C2B"],
   correct:1,
   explain:"B2B (Business-to-Business) transactions occur between businesses, such as a wholesaler selling to a retailer.",
   type:"Type B"},
  {q:"Entrepreneurship should not be regarded only as establishing a new business because:",
   options:["Entrepreneurs are mainly concerned with managing employees","Only registered businesses can create opportunities","Entrepreneurial activities can also take place within existing organizations","Businesses do not require entrepreneurial activities"],
   correct:2,
   explain:"Entrepreneurship includes innovative activities within existing organizations (intrapreneurship) as well as starting new ventures.",
   type:"Type B"},
  {q:"An employee observes repeated customer complaints about a particular service and proposes a new system to management to solve the problem. Which entrepreneurial characteristic is most evident?",
   options:["Financial independence","Risk avoidance","Business ownership","Opportunity recognition"],
   correct:3,
   explain:"Opportunity recognition involves seeing problems or gaps as potential business opportunities, as this employee does.",
   type:"Type B"},
  {q:"Which action best demonstrates resourcefulness in entrepreneurship?",
   options:["Finding alternative ways to pursue an opportunity using available resources","Waiting until enough money is available before taking action","Abandoning an idea because resources are limited","Avoiding opportunities that require additional effort"],
   correct:0,
   explain:"Resourcefulness is the ability to creatively use available resources to overcome obstacles and pursue opportunities.",
   type:"Type B"},
  {q:"An entrepreneur introduces a new administrative procedure that reduces unnecessary paperwork in the organization. Why can this activity be considered entrepreneurship?",
   options:["It requires only financial investment","It involves innovation within an existing organization","It involves purchasing an existing business","It requires the formation of a cooperative"],
   correct:1,
   explain:"This is intrapreneurship — introducing an innovation within an existing organization, which is a form of entrepreneurship.",
   type:"Type B"},
  {q:"Which situation best demonstrates an entrepreneur acting as a change agent?",
   options:["Waiting for competitors to introduce improvements","Rejecting customer complaints without investigation","Maintaining an inefficient procedure because it is familiar","Introducing a better way of delivering a service"],
   correct:3,
   explain:"A change agent actively introduces and implements improvements, like a better way of delivering a service.",
   type:"Type B"},
  // Type C
  {q:"Which of the following best captures the broader meaning of entrepreneurship?",
   options:["Managing an already established business","Identifying opportunities and creating value","Obtaining enough money to start a business","Taking financial risks for the purpose of making profit"],
   correct:1,
   explain:"Entrepreneurship is fundamentally about identifying opportunities and creating value, rather than just managing or funding.",
   type:"Type C"},
  {q:"According to Schumpeter, an entrepreneur is primarily a person who:",
   options:["Manages an existing business without making major changes","Avoids uncertainty through insurance","Introduces new combinations into economic activity","Concentrates mainly on reducing business expenses"],
   correct:2,
   explain:"Schumpeter defined the entrepreneur as an innovator who introduces new combinations (new products, methods, markets, etc.) into the economy.",
   type:"Type C"},
  {q:"Which situation best represents Kirznerian entrepreneurship?",
   options:["Developing a completely new production machine","Discovering an unmet demand for an existing product","Replacing an industry with a completely new technology","Introducing a new method of production"],
   correct:1,
   explain:"Kirznerian entrepreneurship focuses on alertness to previously unnoticed opportunities, such as discovering unmet demand for an existing product.",
   type:"Type C"},
  {q:"An employee develops and successfully implements a new customer-service system within the telecommunications company where he works. This is an example of:",
   options:["Intrapreneurship","Necessity entrepreneurship","Sole proprietorship","Creative destruction"],
   correct:0,
   explain:"Intrapreneurship refers to entrepreneurial activities within an existing organization, like developing a new customer-service system.",
   type:"Type C"},
  {q:"According to Frank Knight, what is the major difference between risk and uncertainty?",
   options:["Risk cannot be measured, whereas uncertainty can be measured","Risk can be measured, whereas uncertainty cannot be measured","Both risk and uncertainty can always be insured","Neither risk nor uncertainty influences entrepreneurial decisions"],
   correct:1,
   explain:"Knight distinguished between measurable risk (where outcomes can be probabilistically assessed) and unmeasurable uncertainty.",
   type:"Type C"},
  {q:"A graduate establishes a small poultry business after failing repeatedly to obtain employment. This is best described as:",
   options:["Corporate entrepreneurship","Opportunity-based entrepreneurship","Intrapreneurship","Necessity-based entrepreneurship"],
   correct:3,
   explain:"Necessity-based entrepreneurship occurs when someone starts a business because other employment options are unavailable.",
   type:"Type C"},
  {q:"A traditional production method becomes obsolete because a more efficient technology has been introduced, while new businesses emerge from the new technology. This illustrates:",
   options:["Networking","Creative destruction","Reflective thinking","Business registration"],
   correct:1,
   explain:"Creative destruction, as described by Schumpeter, is the process where new innovations replace old technologies and economic structures.",
   type:"Type C"},
  {q:"Which action best demonstrates calculated risk-taking?",
   options:["Borrowing money without planning how to repay it","Investing all available funds without studying the market","Testing a product on a small scale before expanding","Starting a business without considering possible losses"],
   correct:2,
   explain:"Calculated risk-taking involves testing and assessing before fully committing, such as trying a product on a small scale first.",
   type:"Type C"},
  {q:"An entrepreneur studies market information, compares competitors' prices and evaluates possible consequences before introducing a product. Which type of thinking is demonstrated?",
   options:["Creative thinking","Passive thinking","Critical thinking","Reflective thinking"],
   correct:2,
   explain:"Critical thinking involves analysis, comparison, and evaluation of information to make reasoned decisions.",
   type:"Type C"},
  {q:"After a business performs poorly, the entrepreneur examines the causes of failure and decides what should be changed in the next attempt. This illustrates:",
   options:["Reflective thinking","Opportunity seeking","Marketing innovation","Critical thinking"],
   correct:0,
   explain:"Reflective thinking involves looking back at experiences, analyzing them, and learning for the future.",
   type:"Type C"}
];

const TAGS = ["A","B","C","D"];

let order = [...QUESTIONS.keys()];
let i = 0;
let score = 0;
let missed = []; // indices into QUESTIONS that were answered wrong

const els = {
  qposition: document.getElementById('qposition'),
  qtotal: document.getElementById('qtotal'),
  scoreLive: document.getElementById('scoreLive'),
  trackFill: document.getElementById('trackFill'),
  qnum: document.getElementById('qnum'),
  prompt: document.getElementById('prompt'),
  options: document.getElementById('options'),
  feedback: document.getElementById('feedback'),
  verdict: document.getElementById('verdict'),
  explain: document.getElementById('explain'),
  nextBtn: document.getElementById('nextBtn'),
  quizArea: document.getElementById('quizArea'),
  resultsArea: document.getElementById('resultsArea'),
  finalScore: document.getElementById('finalScore'),
  finalPercent: document.getElementById('finalPercent'),
  remark: document.getElementById('remark'),
  missedList: document.getElementById('missedList'),
  retryAll: document.getElementById('retryAll'),
  retryMissed: document.getElementById('retryMissed'),
};

els.qtotal.textContent = order.length;

function renderQuestion(){
  const qi = order[i];
  const item = QUESTIONS[qi];
  
  // Determine question type label
  let typeLabel = '';
  if (qi < 10) typeLabel = 'Type A Question ' + (qi + 1);
  else if (qi < 20) typeLabel = 'Type B Question ' + (qi - 9);
  else typeLabel = 'Type C Question ' + (qi - 19);

  els.qposition.textContent = i + 1;
  els.qtotal.textContent = order.length;
  els.scoreLive.textContent = `Score: ${score}`;
  els.trackFill.style.width = `${((i) / order.length) * 100}%`;

  els.qnum.textContent = typeLabel;
  els.prompt.textContent = item.q;

  // Reset feedback
  els.feedback.classList.remove('show');
  els.nextBtn.style.display = 'none';

  // Build options
  const optContainer = els.options;
  optContainer.innerHTML = '';
  item.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.disabled = false;
    btn.innerHTML = `<span class="tag">${TAGS[idx]}</span><span>${opt}</span>`;
    btn.dataset.idx = idx;
    btn.addEventListener('click', () => handleAnswer(idx));
    optContainer.appendChild(btn);
  });
}

function handleAnswer(selected){
  const qi = order[i];
  const item = QUESTIONS[qi];
  const btns = els.options.querySelectorAll('.option');
  const isCorrect = (selected === item.correct);

  // Disable all buttons
  btns.forEach(b => b.disabled = true);

  // Highlight correct/wrong
  btns.forEach((b, idx) => {
    if(idx === item.correct) b.classList.add('correct');
    if(idx === selected && !isCorrect) b.classList.add('wrong');
    if(idx !== selected && idx !== item.correct) b.classList.add('faded');
  });

  // Show feedback
  els.feedback.classList.add('show');
  const verdictEl = els.verdict;
  if(isCorrect){
    verdictEl.textContent = '✅ Correct';
    verdictEl.className = 'verdict right';
    score++;
    els.scoreLive.textContent = `Score: ${score}`;
  } else {
    verdictEl.textContent = '❌ Incorrect';
    verdictEl.className = 'verdict wrong';
    if(!missed.includes(qi)) missed.push(qi);
  }
  els.explain.textContent = item.explain;

  // Show next button
  els.nextBtn.style.display = 'flex';
}

function nextQuestion(){
  i++;
  if(i < order.length){
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults(){
  els.quizArea.style.display = 'none';
  els.resultsArea.style.display = 'block';

  const total = order.length;
  const percent = Math.round((score / total) * 100);
  els.finalScore.textContent = `${score} / ${total}`;
  els.finalPercent.textContent = `${percent}%`;

  let remark = '';
  if(percent === 100) remark = '🏆 Excellent! You have a strong grasp of entrepreneurship concepts.';
  else if(percent >= 70) remark = '👍 Good job! Review the missed questions to reinforce your understanding.';
  else if(percent >= 50) remark = '📖 Keep studying! Focus on the topics you missed.';
  else remark = '💪 Don\'t give up! Review the material and try again.';
  els.remark.textContent = remark;

  // Build missed list
  const list = els.missedList;
  list.innerHTML = '';
  if(missed.length === 0){
    const li = document.createElement('li');
    li.textContent = '🎉 No questions missed! Perfect score!';
    list.appendChild(li);
  } else {
    missed.forEach(idx => {
      const item = QUESTIONS[idx];
      let typeLabel = '';
      if (idx < 10) typeLabel = 'Type A Question ' + (idx + 1);
      else if (idx < 20) typeLabel = 'Type B Question ' + (idx - 9);
      else typeLabel = 'Type C Question ' + (idx - 19);
      const li = document.createElement('li');
      li.innerHTML = `
        <div class="q">${typeLabel}: ${item.q}</div>
        <div class="a">✔ Correct answer: <b>${TAGS[item.correct]}: ${item.options[item.correct]}</b></div>
      `;
      list.appendChild(li);
    });
  }
}

function resetQuiz(newOrder){
  order = newOrder;
  i = 0;
  score = 0;
  missed = [];
  els.quizArea.style.display = 'block';
  els.resultsArea.style.display = 'none';
  renderQuestion();
}

// Event listeners
els.nextBtn.addEventListener('click', nextQuestion);

els.retryAll.addEventListener('click', () => {
  resetQuiz([...QUESTIONS.keys()]);
});

els.retryMissed.addEventListener('click', () => {
  if(missed.length === 0){
    alert('You didn\'t miss any questions! Try the full quiz again.');
    return;
  }
  resetQuiz([...missed]);
});

// Initialize
renderQuestion();
</script>
</body>
</html>
